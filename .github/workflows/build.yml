name: Build plugins

# Push: macOS only (fast). Windows or both: Actions → Build plugins →
# Run workflow → choose the platform.
on:
  push:
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform"
        type: choice
        options: [macos, windows, both]
        default: macos

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'workflow_dispatch' && (inputs.platform == 'windows' && '["windows-latest"]' || inputs.platform == 'both' && '["macos-15-intel","windows-latest"]' || '["macos-15-intel"]') || '["macos-15-intel"]') }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then TESTS=ON; else TESTS=OFF; fi
          # macOS: Universal (Apple Silicon + Intel), built on the Intel runner (as BS4)
          # (Intel runners stopped being assigned)
          ARCH=""; [ "$RUNNER_OS" = "macOS" ] && ARCH='-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64'
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DVT4_BUILD_TESTS=$TESTS ${ARCH:+"$ARCH"} -DVT4_FORMATS="$( [ "$RUNNER_OS" = "macOS" ] && echo 'AU;VST3' || echo 'VST3' )"

      - name: Build plugins
        run: cmake --build build --config Release --parallel --target HaldenVT4_All

      - name: Upload plugins
        uses: actions/upload-artifact@v4
        with:
          name: HaldenVT4-${{ runner.os }}
          path: |
            build/HaldenVT4_artefacts/Release/VST3
            build/HaldenVT4_artefacts/Release/AU
          if-no-files-found: warn

      # Ready-to-download zips on the "latest" release page (no login needed)
      - name: Publish to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd build/HaldenVT4_artefacts/Release
          NAME="HaldenVT4-$RUNNER_OS.zip"
          if [ "$RUNNER_OS" = "Windows" ]; then
            powershell -Command "Compress-Archive -Path VST3 -DestinationPath $NAME -Force"
          else
            ditto -c -k --keepParent VST3 vst3.zip && mkdir -p pkg && cp -R VST3 AU pkg/ 2>/dev/null; (cd pkg && ditto -c -k . ../$NAME)
          fi
          gh release view latest -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create latest -R "$GITHUB_REPOSITORY" --title "Halden VT-4 (latest build)" --notes "Latest builds of Halden VT-4."
          gh release upload latest "$NAME" -R "$GITHUB_REPOSITORY" --clobber

      # Windows only: the measurement bench on the machine type you use.
      - name: Measurement bench
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: bash
        run: |
          cmake --build build --config Release --parallel --target vt4_bench
          BIN=$(find build -type f \( -name vt4_bench -o -name vt4_bench.exe \) | head -n 1)
          "$BIN" quick | tee bench-report.txt

      - name: Upload bench report
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: bench-report-${{ runner.os }}
          path: bench-report.txt
          if-no-files-found: ignore
